# Render.com Blueprint for PaperIQ
# Single Docker service that builds React (Vite) and serves it via Django + Gunicorn.
#
# After connecting this repo on Render:
#   1. Create a new "Blueprint" deploy from render.yaml, or
#   2. Create a Web Service manually and select "Docker" with this repo's root Dockerfile.
#
# Required environment variables you must set in the Render dashboard:
#   - DJANGO_SECRET_KEY   (generated securely by Render)
#   - MONGODB_URI         (MongoDB Atlas connection string)
#   - GEMINI_API_KEY      (Google Generative AI key)
#
# Optional:
#   - DJANGO_ALLOWED_HOSTS (defaults to *; Render adds RENDER_EXTERNAL_HOSTNAME automatically)
#   - WEB_CONCURRENCY      (gunicorn workers, default 1 on the free tier)

services:
  - type: web
    name: paperiq
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MONGODB_DB_NAME
        value: "paperiq_db"
      # Set this to your Vercel frontend origin after the frontend is deployed.
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      # Secrets you must fill in via the Render dashboard:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
